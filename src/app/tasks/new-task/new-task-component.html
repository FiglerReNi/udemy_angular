<div class="backdrop" (click)="onCancel()"></div>
<dialog open>
  <h2>Add Task</h2>
  <form (ngSubmit)="onSubmit()">
    <p>
      <label for="title">Title</label>
      <!--two-ways binding [(ngModel)] kívülről kapott tárolt értéket átadja az inputnak, de az inputba beírtat át
      tudja adni kifelé []->befelé jel pl @Input; ()->kifelé jel, események pl click, vagy @Output-->
      <input type="text" id="title" name="title" [(ngModel)]="enteredTitle"/>
    </p>
<!--    <p>-->
<!--      <label for="title2">Title2</label>-->
<!--      <input type="text" id="title2" name="title2" [(ngModel)]="enteredTitle"/>-->
<!--    </p>-->
    <p>
      <label for="summary">Summary</label>
      <textarea id="summary" rows="5" name="summary" [(ngModel)]="enteredSummary"></textarea>
    </p>

    <p>
      <label for="due-date">Due Date</label>
      <input type="date" id="due-date" name="due-date" [(ngModel)]="enteredDate"/>
    </p>

    <p class="actions">
      <button type="button" (click)="onCancel()">Cancel</button>
      <button type="submit">Create</button>
    </p>
  </form>
</dialog>
